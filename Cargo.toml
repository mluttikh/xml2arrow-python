[package]
name = "_xml2arrow"
version = "0.18.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_xml2arrow"
crate-type = ["cdylib"]

[dependencies]
xml2arrow = { version = "0.18.0", features = ["python"] }
arrow = { version = "59.0.0", features = ["pyarrow"] }
# from_yaml_str deserializes via upstream's documented string route. The
# version requirement must stay in lockstep with upstream xml2arrow's so
# cargo unifies to one copy — the From<yaml_serde::Error> impl needs type
# identity. Drift fails loudly at compile time.
yaml_serde = "0.10"

[dependencies.pyo3]
version = "0.28"
features = ["extension-module", "abi3-py310"]

# Wheel builds go through this profile (maturin build --release); the
# size/speed win is worth the slower release compile.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
